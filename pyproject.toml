[project]
name = "investing-agent"
version = "0.1.0"
description = "Local-first investment research harness for deterministic US stock screening."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.0.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
openbb = ["openbb>=4.0.0"]
dev = ["mypy>=1.10.0", "pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
investing-agent = "apps.cli.main:main"

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["research/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["yfinance"]
ignore_missing_imports = true
